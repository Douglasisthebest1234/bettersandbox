<title>Melon Drop</title>
<style>
  /* Layout: a narrow sidebar holding one person, next to a box that fills the rest of the screen. */
  :root {
    --bg: #eef0f4;
    --side: #2f3e5c;
    --on-side: #f3f5fa;
    --box: #fafbfd;
    --edge: #1d2740;
    --blood: #d7263d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1118; --side: #26324d; --on-side: #f3f5fa; --box: #161b26;
      --edge: #5d6f99; --blood: #ff4d63;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1118; --side: #26324d; --on-side: #f3f5fa; --box: #161b26;
    --edge: #5d6f99; --blood: #ff4d63;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    padding-inline: 16px;
    padding-block: 12px;
  }
  .game {
    display: grid;
    grid-template-columns: 132px minmax(0, 1fr);
    gap: 12px;
  }

  .sidebar {
    background: var(--side);
    border-radius: 16px;
    padding: 20px 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    align-content: flex-start;
    gap: 20px 14px;
    max-height: 95vh;
    overflow-y: auto;
  }
  .sword { width: 22px; }
  #dog, #pig { width: 52px; }
  #cow { width: 64px; }
  #axe { width: 36px; }
  #bat { width: 18px; }
  #gun { width: 46px; }
  #dagger { width: 16px; }
  #katana { width: 13px; }
  #spear { width: 10px; }
  #shotgun { width: 60px; }
  #rifle { width: 72px; }
  #car { width: 84px; }
  #truck { width: 104px; }
  #bike { width: 56px; }
  #heli { width: 104px; }
  #pickup { width: 84px; }
  #bus { width: 104px; }
  #tank { width: 96px; }
  #plane { width: 100px; }
  #grenade { width: 24px; }
  #tnt { width: 32px; }
  #nuke { width: 66px; }
  .person:not(.sword) {
    width: 46px;
  }
  .person {
    padding: 0;
    border: 0;
    background: none;
    cursor: grab;
    touch-action: none;
    border-radius: 8px;
  }
  .person:focus-visible { outline: 3px solid var(--on-side); outline-offset: 6px; }
  .person svg, .ghost svg { display: block; width: 100%; height: auto; }

  .box {
    position: relative;
    height: 95vh;
    min-height: 440px;
    border-radius: 16px;
    border: 4px solid var(--edge);
    background: var(--box);
    overflow: hidden;
  }
  .box canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .ghost {
    position: fixed;
    left: 0; top: 0;
    width: 46px;
    margin: -52px 0 0 -23px;
    pointer-events: none;
    z-index: 10;
    will-change: transform;
  }

  #mgun { width: 62px; }
  #minigun { width: 72px; }
  #rocket { width: 70px; }
  #laser { width: 58px; }
  #flamer { width: 62px; }
  #taser { width: 38px; }
  #saber { width: 13px; }
  #hammer { width: 24px; }
  #crowbar { width: 14px; }
  #chainsaw { width: 22px; }
  #molotov { width: 20px; }
  #mine { width: 36px; }
  #helmet { width: 34px; }
  #vest { width: 30px; }
  #block { width: 40px; }
  #plank { width: 72px; }
  .tools {
    position: absolute;
    top: 8px; right: 8px;
    z-index: 2;
    display: flex;
    gap: 6px;
  }
  .tools button {
    padding: 5px 10px;
    border-radius: 8px;
    border: 2px solid var(--edge);
    background: var(--box);
    color: CanvasText;
    font: 13px system-ui, sans-serif;
    cursor: pointer;
  }
  .tools button[aria-pressed="true"] { background: var(--side); color: var(--on-side); }
  .menu {
    position: fixed;
    z-index: 20;
    padding: 4px;
    border-radius: 8px;
    border: 2px solid var(--edge);
    background: var(--box);
  }
  .menu button {
    display: block;
    width: 100%;
    padding: 6px 10px;
    border: 0;
    border-radius: 5px;
    background: none;
    color: CanvasText;
    font: 14px system-ui, sans-serif;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover { background: var(--bg); }

  @media (max-width: 640px) {
    .game { grid-template-columns: minmax(0, 1fr); }
    .sidebar { padding: 8px 16px; flex-direction: row; gap: 24px; }
    .person:not(.sword) { width: 30px; }
    .sidebar { gap: 16px; flex-wrap: wrap; }
    .sword { width: 15px; }
    #axe { width: 24px; }
    #bat { width: 12px; }
    #gun { width: 32px; }
    .sidebar { justify-content: flex-start; max-height: none; }
    #dog, #pig { width: 36px; }
    #cow { width: 44px; }
    #dagger { width: 11px; }
    #katana { width: 9px; }
    #spear { width: 7px; }
    #shotgun { width: 42px; }
    #rifle { width: 50px; }
    #car { width: 56px; }
    #truck { width: 72px; }
    #bike { width: 40px; }
    #heli { width: 72px; }
    #grenade { width: 18px; }
    #tnt { width: 24px; }
    #nuke { width: 46px; }
    .box { height: 80vh; }
  }
</style>

        var t = fx * dx + fy * dy;
        if (t <= 0 || t >= best) continue;
        if (fx * fx + fy * fy - t * t >= pts[j].r * pts[j].r) continue;

  // Pulling the trigger: one shot, or for an automatic, firing until it is pulled again
  function trigger(s) {
    if (s.kind.auto) s.firing = !s.firing;

  }
  function fire(s) {
    if (s.kind.flame) {
      var fa = s.ang + (Math.random() - 0.5) * 0.25;
      flame(s.b.x, s.b.y, Math.cos(fa) * 520, Math.sin(fa) * 520, 0.45, true);
      return;
    }
    var n = s.kind.rocket ? 0 : s.kind.pellets || 1;
    if (s.kind.rocket) launch(s.b.x, s.b.y, s.ang);
    for (var i = 0; i < n; i++) shot(s, s.ang + (Math.random() - 0.5) * (s.kind.spread || 0));

    var kick = s.len > 40 ? 4 : 2.5, dx = Math.cos(s.ang) * kick, dy = Math.sin(s.ang) * kick;

  function drawSword(s) {
    ctx.save();
    ctx.translate(s.a.x, s.a.y);
    ctx.rotate(s.ang);

    if (!s.kind.cut || !s.kind.stab) { drawOther(s); ctx.restore(); return; }
    ctx.fillStyle = '#7a4a22';
    ctx.fillRect(0, -3, 14, 6);
    ctx.fillStyle = '#e3a02f';
    ctx.fillRect(13, -9, 5, 18);
    ctx.fillStyle = s.kind.glow || '#b9c1cd';
    ctx.strokeStyle = s.kind.glow || '#6f7885';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(18, -3.5);
    ctx.lineTo(s.len - 11, -3.5);
    ctx.lineTo(s.len, 0);
    ctx.lineTo(s.len - 11, 3.5);
    ctx.lineTo(18, 3.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

  // Draws the two bones of an arm or leg, starting at BONES index k. A cut bone is left out,
  // and the part below it is drawn where it has fallen.
  function limb(b, k, width, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    for (var i = k; i < k + 2; i++) {
      var p = b.pts[BONES[i][0]], q = b.pts[BONES[i][1]];
      ctx.beginPath();
      if (b.cutB[i]) { ctx.moveTo(q.x, q.y); ctx.lineTo(q.x + 0.01, q.y); }
      else { ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); }
      ctx.stroke();
    }
  }
  function drawAnimal(b) {
    var p = b.pts, sp = b.sp, k = sp.scale, head = p[HEAD];
    var body = b.skin, far = b.state === 'dead' ? '#8f908a' : sp.far;
    limb(b, 15, 6 * k, far);
    limb(b, 19, 6 * k, far);
    // tail, pointing away from the chest
    var tx = p[HR].x - p[CH].x, ty = p[HR].y - p[CH].y, tl = Math.hypot(tx, ty) || 1;
    ctx.strokeStyle = body;
    ctx.lineWidth = 3 * k;
    ctx.beginPath();
    ctx.moveTo(p[HR].x, p[HR].y);
    ctx.lineTo(p[HR].x + tx / tl * sp.tail, p[HR].y + ty / tl * sp.tail - sp.tail * 0.5);
    ctx.stroke();

    ctx.fillStyle = body;
    ctx.lineWidth = sp.fat;
    ctx.beginPath();
    ctx.moveTo(p[SL].x, p[SL].y);
    ctx.lineTo(p[SR].x, p[SR].y);
    ctx.lineTo(p[HR].x, p[HR].y);
    ctx.lineTo(p[HL].x, p[HL].y);

    ctx.stroke();

      ctx.lineWidth = 9 * k;
      ctx.beginPath();
      ctx.moveTo(p[SR].x, p[SR].y);
      ctx.lineTo(head.x, head.y);
      ctx.stroke();

    limb(b, 17, 6 * k, body);

    var dx = head.x - p[CH].x, dy = head.y - p[CH].y, dl = Math.hypot(dx, dy) || 1;

    ctx.beginPath();
    ctx.arc(head.x, head.y, 8 * k, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = sp.snout;
    ctx.beginPath();
    ctx.arc(head.x + dx * 7 * k, head.y + dy * 7 * k, 4 * k, 0, Math.PI * 2);
    ctx.fill();

      ctx.moveTo(ex - 2, ey + 2); ctx.lineTo(ex + 2, ey - 2);
      ctx.stroke();

      ctx.arc(ex, ey, 1.5 * k, 0, Math.PI * 2);
      ctx.fill();

    drawRuns(b);

    for (var w = 0; w < b.wounds.length; w++) {
      ctx.beginPath();
      ctx.arc(p[b.wounds[w]].x, p[b.wounds[w]].y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    for (w = 0; w < b.spots.length; w++) {
      var at = spotPos(b, b.spots[w]);
      ctx.beginPath();
      ctx.arc(at.x, at.y, 3, 0, Math.PI * 2);
      ctx.fill();

  // What acid leaves behind: bare bones in place of the body
  function drawSkeleton(b) {
    var p = b.pts, k = b.sp.scale || 1, head = p[HEAD], c = '#cfc8b4';
    function mid(u, v, t) { return { x: u.x + (v.x - u.x) * t, y: u.y + (v.y - u.y) * t }; }
    for (var n = 13; n < BONES.length; n += 2) limb(b, n, 3 * k, c);

    ctx.moveTo(p[HL].x, p[HL].y); ctx.lineTo(p[HR].x, p[HR].y);      // hips

      ctx.strokeStyle = '#c46a12';
      ctx.lineWidth = 1.5;

  function drawPerson(b) {

    ctx.beginPath();

    ctx.lineTo(p[SR].x, p[SR].y);

    ctx.lineTo(p[HL].x, p[HL].y);

    ctx.stroke();

    limb(b, 15, 7, b.skin);

    for (var w = 0; w < b.wounds.length; w++) {

      ctx.arc(wp.x, wp.y, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.arc(wp.x, wp.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }

  function draw() {

  }

  }
  // A sword whose blade or hilt is under the pointer; it is always held by the hilt
  function swordAt(pos) {

    return null;
  }
  function bombAt(pos) {
    for (var i = bombs.length - 1; i >= 0; i--) {

    return null;
  }
  function aim(pos) {
    held.tx = Math.min(Math.max(pos.x + (held.ox || 0), 12), W - 12);
    held.ty = Math.min(Math.max(pos.y + (held.oy || 0), 12), H - 12);
  }

  // Dragging people that are already in the box, by whichever body part was grabbed
  canvas.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || e.ctrlKey) return;   // right-click opens the weapon menu instead

      links.push({ kind: tying.kind, a: tying.a, b: end, len: Math.max(10, Math.hypot(q.x - p.x, q.y - p.y)) });
      if (links.length > MAX_LINKS) links.shift();

    }
    var hit = bombAt(pos) || swordAt(pos) || jointAt(pos) || vehicleAt(pos) || blockAt(pos);

    if (thing) {
      // hold it where it was grabbed, and remember the press so a tap can work the engine or fuse

      hit.oy = thing.y - pos.y;

      hit.sy = pos.y;

      hit.sword.grip = null;

    }
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    held = hit;
    aim(pos);
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', function (e) {
    var pos = mouse = local(e);
    if (held) {
      if ((held.sword || held.vehicle || held.bomb) && Math.hypot(pos.x - held.sx, pos.y - held.sy) > 8) held.moved = true;
      aim(pos);
    }
    else canvas.style.cursor = tying ? 'crosshair' : bombAt(pos) || swordAt(pos) || jointAt(pos) || vehicleAt(pos) || blockAt(pos) ? 'grab' : '';
  });
  function release() {
    // a quick tap on a gun, without dragging it, fires it
    var gun = held && held.sword && held.sword.kind.gun && !held.moved &&
      performance.now() - held.t0 < 350 ? held.sword : null;
    // the same quick tap on a vehicle starts or stops its engine
    if (held && held.vehicle && !held.moved && performance.now() - held.t0 < 350) {
      held.vehicle.on = !held.vehicle.on;
    }
    // and on a bomb it lights the fuse, which can't be put out
    if (held && held.bomb && !held.moved && performance.now() - held.t0 < 350 && held.bomb.fuse === null) {
      light(held.bomb);
    }
    if (held && held.sword && !held.sword.frozen && !held.sword.stuck) take(held.sword);
    held = null;
    if (gun) trigger(gun);
    canvas.style.cursor = '';
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  // Right-clicking opens a menu for whatever is under the pointer, or for the whole box on
  // empty space. Each item is [label, action, ticked].
  var menu = document.createElement('div');
  menu.className = 'menu';
  menu.hidden = true;
  document.body.appendChild(menu);
  function closeMenu() { menu.hidden = true; }
  function showMenu(e, items) {
    menu.textContent = '';
    items.forEach(function (it) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = (it[2] ? '\u2713 ' : '') + it[0];
      btn.addEventListener('click', function () { closeMenu(); it[1](); });
      menu.appendChild(btn);
    });
    menu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
    menu.style.top = Math.max(0, Math.min(e.clientY, window.innerHeight - items.length * 31 - 16)) + 'px';
    menu.hidden = false;
  }
  function setPaused(on) {
    paused = on;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    pauseBtn.setAttribute('aria-pressed', paused);
  }
  function nextSpeed() {
    speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
    speedBtn.textContent = 'Speed ' + (speed === 1 ? '1' : speed === 0.5 ? '\u00bd' : '\u00bc') + '\u00d7';
  }
  function clearAll() {
    bodies.length = swords.length = vehicles.length = bombs.length = blocks.length = 0;
    drops.length = shots.length = booms.length = links.length = puddles.length = 0;
    flames.length = rockets.length = 0;
    held = tying = null;
  }
  var pauseBtn = document.getElementById('pause'), speedBtn = document.getElementById('speed');
  pauseBtn.addEventListener('click', function () { setPaused(!paused); });
  speedBtn.addEventListener('click', nextSpeed);
  document.getElementById('clear').addEventListener('click', clearAll);
  // the liquid button fills the bottom of the box with each liquid in turn, then drains it
  var liquidBtn = document.getElementById('liquid');
  liquidBtn.addEventListener('click', function () {
    var all = [null, 'water', 'acid', 'lava'];
    liquid = all[(all.indexOf(liquid) + 1) % all.length];
    liquidBtn.textContent = 'Liquid: ' + (liquid || 'none');
  });

  canvas.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    var pos = local(e);
    var hit = bombAt(pos) || swordAt(pos) || jointAt(pos) || vehicleAt(pos) || blockAt(pos);
    if (!hit) {
      showMenu(e, [
        [paused ? 'Resume' : 'Pause', function () { setPaused(!paused); }],
        ['Change speed', nextSpeed],
        ['Clear everything', clearAll]
      ]);
      return;
    }
    var o = hit.bomb || hit.sword || hit.body || hit.vehicle || hit.block;
    var list = hit.bomb ? bombs : hit.sword ? swords : hit.body ? bodies : hit.vehicle ? vehicles : blocks;
    var items = [];
    if (hit.sword) {
      [[-1, 'Stay pointing left'], [1, 'Stay pointing right']].forEach(function (side) {
        items.push([side[1], function () { o.lock = o.lock === side[0] ? 0 : side[0]; }, o.lock === side[0]]);
      });
      if (o.kind.gun) items.push([o.kind.auto ? 'Firing' : 'Fire', function () { trigger(o); }, o.firing]);
    }
    if (hit.vehicle) items.push(['Engine running', function () { o.on = !o.on; }, o.on]);
    if (hit.vehicle && o.kind === 'tank') {
      items.push(['Fire the cannon', function () { launch(o.x + o.dir * (o.w / 2 + 8), o.y - o.h / 2 + 12, o.dir > 0 ? 0 : Math.PI); }]);
    }
    if (hit.bomb && o.fuse === null && !o.armed) items.push([o.k.mine ? 'Arm it' : 'Light the fuse', function () { light(o); }]);
    if (hit.body) {
      [[-1, 'Walk left'], [1, 'Walk right']].forEach(function (side) {
        items.push([side[1], function () { o.walk = o.walk === side[0] ? 0 : side[0]; o.sit = false; }, o.walk === side[0]]);
      });
      if (!o.sp.animal) items.push(['Sit down', function () { o.sit = !o.sit; o.walk = 0; }, o.sit]);
      if (o.helmet || o.vest) items.push(['Take off armour', function () { o.helmet = o.vest = false; }]);
    }
    if (!hit.block) {
      items.push(['Frozen in place', function () {
        o.frozen = !o.frozen;
        if (hit.body) o.pin = o.pts.map(function (p) { return { x: p.x, y: p.y }; });
        if (hit.vehicle) { o.fx = o.x; o.fy = o.y; }
      }, o.frozen]);
    }
    ['rope', 'rod', 'spring'].forEach(function (kind) {
      items.push(['Tie a ' + kind + ' from here', function () { tying = { kind: kind, a: anchorAt(pos) }; }]);
    });
    if (links.some(function (l) { return l.a.o === o || l.b.o === o; })) {
      items.push(['Cut everything tied to it', function () {
        links = links.filter(function (l) { return l.a.o !== o && l.b.o !== o; });
      }]);
    }
    items.push(['Delete', function () {
      var at = list.indexOf(o);
      if (at >= 0) list.splice(at, 1);
      if (hit.body) forget(o);
      if (held && (held.body === o || held.sword === o || held.vehicle === o || held.bomb === o || held.block === o)) held = null;
    }]);
    showMenu(e, items);
  });
  document.addEventListener('pointerdown', function (e) { if (!menu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeMenu(); tying = null; }
    if (e.key === 'p' || e.key === 'P') setPaused(!paused);
  });

  // Dragging a new person out of the sidebar
  function moveGhost(e) {
    ghost.el.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    ghost.samples.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    if (ghost.samples.length > 6) ghost.samples.shift();
  }
  // Release velocity from the last few pointer positions; a pause before letting go means a plain drop
  function throwSpeed(list) {
    var a = list[0], b = list[list.length - 1];
    var span = (b.t - a.t) / 1000;
    if (span < 0.005 || performance.now() - b.t > 80) return { x: 0, y: 0 };
    var vx = (b.x - a.x) / span, vy = (b.y - a.y) / span;
    var sp = Math.hypot(vx, vy);
    if (sp > MAX_THROW) { vx *= MAX_THROW / sp; vy *= MAX_THROW / sp; }
    return { x: vx, y: vy };
  }
  function source(btn, spawn) {
    btn.addEventListener('pointerdown', function (e) {
      if (ghost) return;
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      var el = document.createElement('div');
      el.className = 'ghost';
      el.innerHTML = btn.innerHTML;
      el.style.width = btn.offsetWidth + 'px';
      el.style.margin = -btn.offsetHeight / 2 + 'px 0 0 ' + -btn.offsetWidth / 2 + 'px';
      document.body.appendChild(el);
      ghost = { el: el, samples: [] };
      moveGhost(e);
    });
    btn.addEventListener('pointermove', function (e) { if (ghost) moveGhost(e); });
    btn.addEventListener('pointerup', function (e) {
      if (!ghost) return;
      var v = throwSpeed(ghost.samples);
      ghost.el.remove();
      ghost = null;
      var pos = local(e);
      if (pos.x >= 0 && pos.x <= W && pos.y >= 0 && pos.y <= H) spawn(pos.x, pos.y, v.x, v.y);
    });
    btn.addEventListener('pointercancel', function () {
      if (ghost) { ghost.el.remove(); ghost = null; }
    });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        spawn(W / 2, 50, 0, 0);
      }
    });
  }
  source(person, function (x, y, vx, vy) { addBody('human', x, y, vx, vy); });
  ['melon', 'pumpkin', 'corn', 'apple', 'robot', 'dog', 'pig', 'cow'].forEach(function (kind) {
    source(document.getElementById(kind), function (x, y, vx, vy) { addBody(kind, x, y, vx, vy); });
  });
  // armour isn't an object either: dropping it on a person puts it on them
  ['helmet', 'vest'].forEach(function (kind) {
    source(document.getElementById(kind), function (x, y) {
      var hit = jointAt({ x: x, y: y });
      if (hit && !hit.body.sp.animal && !hit.body.bare) hit.body[kind] = true;
    });
  });
  Object.keys(BLOCKS).forEach(function (kind) {
    source(document.getElementById(kind), function (x, y) { addBlock(kind, x, y); });
  });
  Object.keys(VEHICLES).forEach(function (kind) {
    source(document.getElementById(kind), function (x, y, vx, vy) { addVehicle(kind, x, y, vx, vy); });
  });
  Object.keys(POTIONS).forEach(function (kind) {
    source(document.getElementById(kind), function (x, y) { applyPotion(kind, x, y); });
  });
  Object.keys(BOMBS).forEach(function (kind) {
    source(document.getElementById(kind), function (x, y, vx, vy) { addBomb(kind, x, y, vx, vy); });
  });
  Object.keys(KINDS).forEach(function (type) {
    source(document.getElementById(type), function (x, y, vx, vy) { addWeapon(type, x, y, vx, vy); });
  });

  new ResizeObserver(resize).observe(box);
  resize();
  requestAnimationFrame(function (t) { last = t; tick(t); });
})();
</script>
