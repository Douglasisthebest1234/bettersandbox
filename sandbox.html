<title>Melon Drop</title>
<style>
  /* Layout: a narrow sidebar holding one person, next to a box that fills the rest of the screen. */
  :root {
    --bg: #eef0f4;
    --side: #2f3e5c;
    --on-side: #f3f5fa;
    --box: #fafbfd;
    --edge: #1d2740;
    --blood: #d7263d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1118; --side: #26324d; --on-side: #f3f5fa; --box: #161b26;
      --edge: #5d6f99; --blood: #ff4d63;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1118; --side: #26324d; --on-side: #f3f5fa; --box: #161b26;
    --edge: #5d6f99; --blood: #ff4d63;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    padding-inline: 16px;
    padding-block: 12px;
  }
  .game {
    display: grid;
    grid-template-columns: 132px minmax(0, 1fr);
    gap: 12px;
  }

  .sidebar {
    background: var(--side);
    border-radius: 16px;
    padding: 20px 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    align-content: flex-start;
    gap: 20px 14px;
    max-height: 95vh;
    overflow-y: auto;
  }
  .sword { width: 22px; }
  #dog, #pig { width: 52px; }
  #cow { width: 64px; }
  #axe { width: 36px; }
  #bat { width: 18px; }
  #gun { width: 46px; }
  #dagger { width: 16px; }
  #katana { width: 13px; }
  #spear { width: 10px; }
  #shotgun { width: 60px; }
  #rifle { width: 72px; }
  #car { width: 84px; }
  #truck { width: 104px; }
  #bike { width: 56px; }
  #heli { width: 104px; }
  #grenade { width: 24px; }
  #tnt { width: 32px; }
  #nuke { width: 66px; }
  .person:not(.sword) {
    width: 46px;
  }
  .person {
    padding: 0;
    border: 0;
    background: none;
    cursor: grab;
    touch-action: none;
    border-radius: 8px;
  }
  .person:focus-visible { outline: 3px solid var(--on-side); outline-offset: 6px; }
  .person svg, .ghost svg { display: block; width: 100%; height: auto; }

  .box {
    position: relative;
    height: 95vh;
    min-height: 440px;
    border-radius: 16px;
    border: 4px solid var(--edge);
    background: var(--box);
    overflow: hidden;
  }
  .box canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .ghost {
    position: fixed;
    left: 0; top: 0;
    width: 46px;
    margin: -52px 0 0 -23px;
    pointer-events: none;
    z-index: 10;
    will-change: transform;
  }

  @media (max-width: 640px) {
    .game { grid-template-columns: minmax(0, 1fr); }
    .sidebar { padding: 8px 16px; flex-direction: row; gap: 24px; }
    .person:not(.sword) { width: 30px; }
    .sidebar { gap: 16px; flex-wrap: wrap; }
    .sword { width: 15px; }
    #axe { width: 24px; }
    #bat { width: 12px; }
    #gun { width: 32px; }
    .sidebar { justify-content: flex-start; max-height: none; }
    #dog, #pig { width: 36px; }
    #cow { width: 44px; }
    #dagger { width: 11px; }
    #katana { width: 9px; }
    #spear { width: 7px; }
    #shotgun { width: 42px; }
    #rifle { width: 50px; }
    #car { width: 56px; }
    #truck { width: 72px; }
    #bike { width: 40px; }
    #heli { width: 72px; }
    #grenade { width: 18px; }
    #tnt { width: 24px; }
    #nuke { width: 46px; }
    .box { height: 80vh; }
  }
</style>

<script>
(function () {
  var STEP = 1 / 120;    // fixed physics step, s
  var GRAVITY = 2200;    // px/s^2
  var BREAK = 950;       // body speed into a wall (px/s) that breaks bones: a drop of about 205px
  var KILL = 1400;       // body speed into a wall (px/s) that kills: a drop of about 445px
  var STAND = 0.06;      // how hard a healthy person pulls themselves upright each step
  var STAB = 500;        // point-first speed (px/s) a sword needs to go in
  var SLASH = 700;       // blade speed against a body part (px/s) at which it cuts
  var BLOOD = '#b3243a';
  var BLEED = 5;         // blood lost per second from each bleeding wound, out of 100
  // Weapons. sever / behead are the chances a fast cut takes a limb or the head off.
  var KINDS = {
    sword: { len: 78, stab: true, cut: true, sever: 0.5, behead: 0.35 },
    dagger: { len: 44, stab: true, cut: true, sever: 0.1, behead: 0 },
    katana: { len: 96, stab: true, cut: true, sever: 0.85, behead: 0.8 },
    spear: { len: 120, stab: true },
    axe: { len: 70, cut: true, sever: 1, behead: 1 },
    bat: { len: 74, club: true },
    gun: { len: 30, gun: true },
    shotgun: { len: 46, gun: true, pellets: 6, spread: 0.32 },   // six pellets in a cone
    rifle: { len: 62, gun: true, pierce: true }                  // goes through everyone in line
  };
  var DEPTH = 26;        // how far past the joint a lodged blade sticks through
  var MAX_SWORDS = 14;
  // Vehicles are solid boxes w wide and h tall that never tip over. speed is px/s with the engine on.
  var VEHICLES = {
    car: { w: 96, h: 50, speed: 560, color: '#d9483b' },
    truck: { w: 150, h: 80, speed: 660, color: '#3d8fd1' },
    bike: { w: 60, h: 36, speed: 760, color: '#3fa66b' },
    heli: { w: 110, h: 44, speed: 300, color: '#e3a02f', fly: true }   // starts with its engine on
  };
  var MAX_VEHICLES = 6;
  // Bombs. r is the bomb's size, radius the blast reach, power the blast speed at the centre (px/s),
  // fuse the seconds from a tap to the blast, sever the chance each limb in the inner blast comes off.
  // The nuke reaches the whole box whatever its radius says.
  var BOMBS = {
    grenade: { r: 9, radius: 150, power: 1500, fuse: 2, sever: 0.3, color: '#4f6b3a' },
    tnt: { r: 13, radius: 260, power: 2400, fuse: 3, sever: 0.6, color: '#d9483b' },
    nuke: { r: 20, radius: 0, power: 4500, fuse: 4, sever: 1, color: '#5d6470', nuke: true }
  };
  var MAX_BOMBS = 10;
  var VAPORIZE = 260;    // a nuke leaves nothing of anyone this close
  var RUN_BREAK = 350;   // vehicle speed into a body part (px/s) that breaks bones
  var RUN_KILL = 600;    // vehicle speed into the head or chest (px/s) that kills
  var MAX_THROW = 3200;
  var MAX_PEOPLE = 16;
  var STIFFNESS = 5;     // joint passes per step
  var GRAB = 24;         // how close the pointer must be to a joint to grab it

  // Joints: offset from the body centre, and collision radius
  var HEAD = 0, SL = 1, SR = 2, CH = 3, HL = 4, HR = 5, EL = 6, WL = 7, ER = 8, WR = 9, KL = 10, FL = 11, KR = 12, FR = 13;
  var SHAPE = [
    [0, -38, 10],                 // head
    [-10, -24, 8], [10, -24, 8],  // shoulders
    [0, -10, 11],                 // chest
    [-7, 8, 8], [7, 8, 8],        // hips
    [-15, -8, 5], [-17, 8, 5],    // left elbow, hand
    [15, -8, 5], [17, 8, 5],      // right elbow, hand
    [-8, 28, 5], [-9, 48, 5],     // left knee, foot
    [8, 28, 5], [9, 48, 5]        // right knee, foot
  ];
  // Bones. The head and torso are braced rigid; arms and legs hinge at shoulder, elbow, hip and knee.
  var BONES = [
    [HEAD, SL], [HEAD, SR], [HEAD, CH],
    [SL, SR], [SL, HL], [SR, HR], [HL, HR], [SL, HR], [SR, HL],
    [CH, SL], [CH, SR], [CH, HL], [CH, HR],
    [SL, EL], [EL, WL], [SR, ER], [ER, WR],
    [HL, KL], [KL, FL], [HR, KR], [KR, FR]
  ].map(function (b) {
    var p = SHAPE[b[0]], q = SHAPE[b[1]];
    return [b[0], b[1], Math.hypot(p[0] - q[0], p[1] - q[1])];
  });
  var SKIN = ['#f1c9a5', '#e0a878', '#c68a5c', '#8d5a3b'];
  var HAIR = ['#3a2a1e', '#1d1a19', '#7a4a22', '#c9a24a', '#8a8d93'];
  var SHIRT = ['#e2574c', '#3d8fd1', '#3fa66b', '#e3a02f', '#8a63c9', '#d9669a'];
  var PANTS = '#5a6b94';

  // Animals reuse the human skeleton laid out sideways, facing right: the "arms" are the front
  // legs and the torso corners are chest-bottom (SL), withers (SR), belly-back (HL) and rump (HR).
  // The near legs hang from the bottom corners, the far legs from the top ones.
  function quad(k) {
    return [
      [30, -20, 8],
      [16, -2, 6], [18, -12, 6],
      [0, -6, 9],
      [-18, -2, 6], [-20, -11, 6],
      [17, 10, 4], [17, 22, 4],
      [22, 9, 4], [22, 22, 4],
      [-17, 10, 4], [-17, 22, 4],
      [-22, 9, 4], [-22, 22, 4]
    ].map(function (s) { return [s[0] * k, s[1] * k, s[2] * k]; });
  }
  // Each species gets its own bone lengths and the offset of its standing feet from its centre
  function species(shape, look) {
    look.shape = shape;
    look.lens = BONES.map(function (b) {
      return Math.hypot(shape[b[0]][0] - shape[b[1]][0], shape[b[0]][1] - shape[b[1]][1]);
    });
    look.fx = (shape[FL][0] + shape[FR][0]) / 2;
    look.fy = Math.max(shape[FL][1], shape[FR][1]);
    return look;
  }
  var SPECIES = {
    human: species(SHAPE, {}),
    dog: species(quad(1), { animal: true, scale: 1, fat: 13, tail: 14, body: '#d9a441', far: '#b5852f', snout: '#f3d9a0' }),
    pig: species(quad(1), { animal: true, scale: 1, fat: 22, tail: 6, body: '#f0a3b0', far: '#d98998', snout: '#f7c4cc' }),
    cow: species(quad(1.6), { animal: true, scale: 1.6, fat: 26, tail: 22, body: '#7a4b2e', far: '#5f3a23', snout: '#e8c9b0' })
  };

  var person = document.getElementById('person');
  var box = document.getElementById('box');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;
  var vehicles = [], bombs = [], booms = [], flash = 0;
  var bodies = [], swords = [], drops = [], shots = [];   // swords holds every weapon
  var held = null;       // { body or sword, pt, tx, ty } while dragging inside the box
  var ghost = null;      // { el, samples } while dragging out of the sidebar
  var last = 0, acc = 0, clock = 0;

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = box.clientWidth;
    H = box.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function addBody(kind, x, y, vx, vy) {
    var sp = SPECIES[kind];
    var flip = sp.animal && Math.random() < 0.5 ? -1 : 1;   // animals face either way
    x = Math.min(Math.max(x, 24), W - 24);
    y = Math.min(Math.max(y, 50), H - 55);
    var pts = sp.shape.map(function (s) {
      var px = x + s[0] * flip, py = y + s[1];
      return { x: px, y: py, px: px - vx * STEP, py: py - vy * STEP, r: s[2] };
    });
    bodies.push({
      sp: sp, flip: flip,
      pts: pts, cvx: vx, cvy: vy, skin: sp.animal ? sp.body : pick(SKIN), hair: pick(HAIR), shirt: pick(SHIRT),
      state: 'ok',      // 'ok' can stand, 'broken' is alive but can't, 'dead' is limp for good
      ground: 0,        // seconds of footing left since last touching something to stand on
      standing: false,
      wounds: [],       // joints a sword has gone into
      bleed: {},        // seconds each wound keeps bleeding, by joint
      blood: 100,       // drains while wounds bleed; too weak to stand below 35, dead at 0
      cutB: [],         // bones that have been cut through, by BONES index
      off: [],          // joints no longer attached to the body
      limp: [],         // arm joints that hang loose after a stab
      seen: {}          // when each part can next be cut, so one swing rolls the dice once
    });
    if (bodies.length > MAX_PEOPLE) {
      var gone = bodies.shift();
      if (held && held.body === gone) held = null;
      swords.forEach(function (s) { if (s.stuck && s.stuck.body === gone) s.stuck = null; });
    }
  }

  // A sword is a hilt and a tip a fixed length apart. It spawns point-down, or point-first if thrown.
  function addWeapon(type, x, y, vx, vy) {
    var kind = KINDS[type];
    var ang = Math.hypot(vx, vy) > 200 ? Math.atan2(vy, vx) : kind.gun ? 0 : Math.PI / 2;
    var half = kind.len / 2, cx = Math.cos(ang) * half, cy = Math.sin(ang) * half;
    function pt(px, py) {
      px = Math.min(Math.max(px, 4), W - 4);
      py = Math.min(Math.max(py, 4), H - 4);
      return { x: px, y: py, px: px - vx * STEP, py: py - vy * STEP };
    }
    swords.push({
      type: type, kind: kind, len: kind.len,
      a: pt(x - cx, y - cy), b: pt(x + cx, y + cy), ang: ang, stuck: null, cool: 0, flash: 0
    });
    if (swords.length > MAX_SWORDS) {
      if (held && held.sword === swords[0]) held = null;
      swords.shift();
    }
  }

  function addVehicle(kind, x, y, vx, vy) {
    var k = VEHICLES[kind];
    vehicles.push({
      kind: kind, k: k, w: k.w, h: k.h,
      x: Math.min(Math.max(x, k.w / 2), W - k.w / 2), y: Math.min(Math.max(y, k.h / 2), H - k.h / 2),
      vx: vx, vy: vy, dir: vx < 0 ? -1 : 1, on: !!k.fly, ground: false
    });
    if (vehicles.length > MAX_VEHICLES) {
      if (held && held.vehicle === vehicles[0]) held = null;
      vehicles.shift();
    }
  }

  function stepVehicle(v) {
    var hw = v.w / 2, hh = v.h / 2, i, j;
    if (held && held.vehicle === v) {
      v.vx = (held.tx - v.x) * 0.3 / STEP;
      v.vy = (held.ty - v.y) * 0.3 / STEP;
      var sp = Math.hypot(v.vx, v.vy);
      if (sp > MAX_THROW) { v.vx *= MAX_THROW / sp; v.vy *= MAX_THROW / sp; }
    } else if (v.k.fly && v.on) {
      // a running helicopter ignores gravity and heads for one random spot after another
      v.wait = (v.wait || 0) - STEP;
      if (!v.goal || v.wait <= 0 || Math.hypot(v.goal.x - v.x, v.goal.y - v.y) < 40) {
        v.goal = { x: hw + Math.random() * (W - v.w), y: hh + 20 + Math.random() * (H - v.h - 40) * 0.8 };
        v.wait = 4;
      }
      var gx = v.goal.x - v.x, gy = v.goal.y - v.y, gd = Math.hypot(gx, gy) || 1;
      v.vx += (gx / gd * v.k.speed - v.vx) * 0.03;
      v.vy += (gy / gd * v.k.speed - v.vy) * 0.03;
      if (Math.abs(v.vx) > 30) v.dir = v.vx < 0 ? -1 : 1;
    } else {
      v.vy += GRAVITY * STEP;
      // on the ground the engine pulls it up to speed; with the engine off it rolls to a stop
      if (v.ground) {
        if (v.on) v.vx += (v.dir * v.k.speed - v.vx) * 0.04;
        else v.vx *= 0.97;
      }
    }
    v.x += v.vx * STEP;
    v.y += v.vy * STEP;
    v.ground = false;
    if (v.y > H - hh) { v.y = H - hh; if (v.vy > 0) v.vy = 0; v.ground = true; }
    else if (v.y < hh) { v.y = hh; if (v.vy < 0) v.vy = 0; }
    // a running vehicle turns round at each wall
    if (v.x > W - hw) { v.x = W - hw; if (v.vx > 0) v.vx = 0; if (v.on) v.dir = -1; }
    else if (v.x < hw) { v.x = hw; if (v.vx < 0) v.vx = 0; if (v.on) v.dir = 1; }

    // People and animals: the vehicle doesn't give way. Each joint is pushed out of the box by
    // the shortest route and carried along; a hard enough hit breaks bones or kills.
    for (i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      if (b.x1 < v.x - hw || b.x0 > v.x + hw || b.y1 < v.y - hh || b.y0 > v.y + hh) continue;
      for (j = 0; j < b.pts.length; j++) {
        var p = b.pts[j];
        var dx = p.x - v.x, dy = p.y - v.y;
        var px = hw + p.r - Math.abs(dx), py = hh + p.r - Math.abs(dy);
        if (px <= 0 || py <= 0) continue;
        var s, into;
        if (px < py) {
          s = dx < 0 ? -1 : 1;
          into = (v.vx - (p.x - p.px) / STEP) * s;
          p.x += s * px;
          p.px = p.x - v.vx * STEP;
        } else {
          s = dy < 0 ? -1 : 1;
          into = (v.vy - (p.y - p.py) / STEP) * s;
          p.y += s * py;
          p.py = p.y - v.vy * STEP;
          if (s < 0) {
            // riding on the roof
            p.px = p.x - v.vx * STEP;
            if (!b.off[j]) b.ground = 0.15;
          }
        }
        if (b.off[j]) continue;
        if (into > RUN_KILL && (j === HEAD || j === CH)) {
          if (b.state !== 'dead') wound(b, j, 12);
          kill(b);
        } else if (into > RUN_BREAK && b.state === 'ok') {
          b.state = 'broken';
        }
      }
    }

    // A spinning rotor cuts whatever reaches into it: fatal to the head or chest, a wound elsewhere
    if (v.k.fly && v.on) {
      var rx = v.x + v.dir * 19, ry = v.y - hh - 4;
      for (i = 0; i < bodies.length; i++) {
        var pts = bodies[i].pts;
        for (j = 0; j < pts.length; j++) {
          if (Math.abs(pts[j].x - rx) > 58 + pts[j].r || Math.abs(pts[j].y - ry) > 6 + pts[j].r) continue;
          if (!fresh(bodies[i], 'r' + j)) continue;
          wound(bodies[i], j, 14);
          if (j === HEAD || j === CH) kill(bodies[i]);
        }
      }
    }
  }

  // Vehicles push each other apart; one that lands on another rests on its roof
  function collideVehicles() {
    for (var i = 0; i < vehicles.length; i++) {
      for (var j = i + 1; j < vehicles.length; j++) {
        var a = vehicles[i], b = vehicles[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        var px = (a.w + b.w) / 2 - Math.abs(dx), py = (a.h + b.h) / 2 - Math.abs(dy);
        if (px <= 0 || py <= 0) continue;
        if (px < py) {
          var s = dx < 0 ? -1 : 1;
          a.x -= s * px / 2;
          b.x += s * px / 2;
          a.vx = b.vx = (a.vx + b.vx) / 2;
          if (a.on) a.dir = -s;
          if (b.on) b.dir = s;
        } else {
          var top = dy > 0 ? a : b, under = dy > 0 ? b : a;
          top.y -= py;
          if (top.vy > under.vy) top.vy = under.vy;
          top.ground = true;
        }
      }
    }
  }

  function wheel(x, y, r) {
    ctx.fillStyle = '#22262e';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#9aa3b2';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  // Drawn in the same coordinates as the sidebar icons, facing right, then mirrored by dir
  function drawVehicle(v) {
    var lamp;
    ctx.save();
    ctx.translate(v.x, v.y);
    ctx.scale(v.dir, 1);
    ctx.translate(-v.w / 2, -v.h / 2);
    ctx.fillStyle = v.k.color;
    if (v.kind === 'car') {
      ctx.beginPath();
      ctx.moveTo(24, 19); ctx.lineTo(30, 3); ctx.lineTo(62, 3); ctx.lineTo(72, 19);
      ctx.fill();
      ctx.fillRect(2, 19, 92, 20);
      ctx.fillStyle = '#bfe3f2';
      ctx.beginPath();
      ctx.moveTo(29, 17); ctx.lineTo(33, 6); ctx.lineTo(60, 6); ctx.lineTo(67, 17);
      ctx.fill();
      wheel(24, 40, 9);
      wheel(72, 40, 9);
      lamp = [92, 25];
    } else if (v.kind === 'truck') {
      ctx.fillRect(104, 22, 44, 40);
      ctx.fillStyle = '#8a94a8';
      ctx.fillRect(2, 2, 100, 60);
      ctx.fillStyle = '#bfe3f2';
      ctx.fillRect(124, 28, 20, 14);
      wheel(26, 67, 12);
      wheel(58, 67, 12);
      wheel(126, 67, 12);
      lamp = [146, 52];
    } else if (v.kind === 'heli') {
      ctx.fillRect(4, 17, 52, 6);                       // tail boom
      ctx.beginPath();
      ctx.moveTo(2, 4); ctx.lineTo(12, 17); ctx.lineTo(2, 24);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(74, 21, 28, 16, 0, 0, Math.PI * 2);   // cabin
      ctx.fill();
      ctx.fillStyle = '#bfe3f2';
      ctx.beginPath();
      ctx.ellipse(86, 18, 13, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#22262e';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(52, 42); ctx.lineTo(100, 42);          // skid
      ctx.moveTo(64, 35); ctx.lineTo(62, 42);
      ctx.moveTo(86, 35); ctx.lineTo(88, 42);
      ctx.moveTo(74, 6); ctx.lineTo(74, -4);            // mast
      // the rotor is a line whose length flickers while it spins
      var reach = v.on ? 14 + 44 * Math.abs(Math.cos(clock * 45)) : 58;
      ctx.moveTo(74 - reach, -4); ctx.lineTo(74 + reach, -4);
      ctx.stroke();
      lamp = null;
    } else {
      wheel(12, 24, 10);
      wheel(48, 24, 10);
      ctx.strokeStyle = v.k.color;
      ctx.lineWidth = 5;
      ctx.lineCap = ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(12, 24); ctx.lineTo(24, 12); ctx.lineTo(40, 12); ctx.lineTo(48, 24);
      ctx.moveTo(40, 12); ctx.lineTo(44, 4);
      ctx.moveTo(20, 9); ctx.lineTo(30, 9);
      ctx.stroke();
      lamp = [47, 6];
    }
    if (v.on && lamp) {
      // headlight shows the engine is running
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath();
      ctx.arc(lamp[0], lamp[1], 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function addBomb(kind, x, y, vx, vy) {
    var k = BOMBS[kind];
    bombs.push({
      kind: kind, k: k, r: k.r, fuse: null,   // fuse is null until a tap lights it
      x: Math.min(Math.max(x, k.r), W - k.r), y: Math.min(Math.max(y, k.r), H - k.r), vx: vx, vy: vy
    });
    if (bombs.length > MAX_BOMBS) {
      if (held && held.bomb === bombs[0]) held = null;
      bombs.shift();
    }
  }

  function explode(m) {
    var k = m.k, R = k.nuke ? Math.hypot(W, H) : k.radius, i, j, d, f, dx, dy;
    m.gone = true;
    booms.push({ x: m.x, y: m.y, R: R, age: 0, life: k.nuke ? 1.3 : 0.45 });

    for (i = bodies.length - 1; i >= 0; i--) {
      var b = bodies[i], near = Infinity;
      for (j = 0; j < b.pts.length; j++) {
        var p = b.pts[j];
        dx = p.x - m.x; dy = p.y - m.y;
        d = Math.hypot(dx, dy) || 0.001;
        if (!b.off[j] && d < near) near = d;
        if (d >= R) continue;
        // thrown outward and a little upward, harder the closer it was
        f = (1 - d / R) * k.power * STEP;
        p.px -= dx / d * f;
        p.py -= dy / d * f - f * 0.3;
      }
      if (near >= R) continue;
      if (k.nuke && near < VAPORIZE) {
        if (held && held.body === b) held = null;
        swords.forEach(function (s) { if (s.stuck && s.stuck.body === b) s.stuck = null; });
        spray(b.pts[CH].x, b.pts[CH].y, 30, 2);
        bodies.splice(i, 1);
        continue;
      }
      // the inner blast kills and tears limbs off; the outer blast breaks bones
      if (k.nuke || near < R * 0.55) {
        for (var n = 13; n < BONES.length; n++) {
          var u = b.pts[BONES[n][0]], v = b.pts[BONES[n][1]];
          var md = Math.hypot((u.x + v.x) / 2 - m.x, (u.y + v.y) / 2 - m.y);
          if (!b.cutB[n] && (k.nuke || md < R * 0.4) && Math.random() < k.sever) sever(b, n);
        }
        if (k.nuke && !b.off[HEAD]) behead(b);
        wound(b, CH, 16);
        kill(b);
      } else if (b.state === 'ok') {
        b.state = 'broken';
      }
    }

    if (k.nuke) {
      // nothing else survives it either
      if (held && (held.vehicle || held.sword)) held = null;
      vehicles.length = 0;
      swords.length = 0;
      flash = 1.6;
    } else {
      for (i = 0; i < vehicles.length; i++) {
        dx = vehicles[i].x - m.x; dy = vehicles[i].y - m.y;
        d = Math.hypot(dx, dy) || 0.001;
        if (d >= R) continue;
        f = (1 - d / R) * k.power * 0.6;
        vehicles[i].vx += dx / d * f;
        vehicles[i].vy += dy / d * f - f * 0.3;
      }
      for (i = 0; i < swords.length; i++) {
        var s = swords[i];
        dx = (s.a.x + s.b.x) / 2 - m.x; dy = (s.a.y + s.b.y) / 2 - m.y;
        d = Math.hypot(dx, dy) || 0.001;
        if (d >= R) continue;
        f = (1 - d / R) * k.power * STEP;
        s.a.px -= dx / d * f; s.a.py -= dy / d * f - f * 0.3;
        s.b.px -= dx / d * f; s.b.py -= dy / d * f - f * 0.3;
      }
    }
    // any other bomb caught in the blast goes off a moment later
    for (i = 0; i < bombs.length; i++) {
      var o = bombs[i];
      if (o === m || o.gone || Math.hypot(o.x - m.x, o.y - m.y) >= R) continue;
      o.fuse = Math.min(o.fuse === null ? 1 : o.fuse, 0.08 + Math.random() * 0.15);
    }
  }

  function stepBombs() {
    var i, m;
    for (i = 0; i < bombs.length; i++) {
      m = bombs[i];
      if (held && held.bomb === m) {
        m.vx = (held.tx - m.x) * 0.3 / STEP;
        m.vy = (held.ty - m.y) * 0.3 / STEP;
        var sp = Math.hypot(m.vx, m.vy);
        if (sp > MAX_THROW) { m.vx *= MAX_THROW / sp; m.vy *= MAX_THROW / sp; }
      } else {
        m.vy += GRAVITY * STEP;
      }
      m.x += m.vx * STEP;
      m.y += m.vy * STEP;
      if (m.y > H - m.r) { m.y = H - m.r; if (m.vy > 0) m.vy = 0; m.vx *= 0.95; }
      else if (m.y < m.r) { m.y = m.r; if (m.vy < 0) m.vy = 0; }
      if (m.x > W - m.r) { m.x = W - m.r; if (m.vx > 0) m.vx = 0; }
      else if (m.x < m.r) { m.x = m.r; if (m.vx < 0) m.vx = 0; }
      if (m.fuse !== null) {
        m.fuse -= STEP;
        if (m.fuse <= 0) explode(m);
      }
    }
    for (i = bombs.length - 1; i >= 0; i--) {
      if (!bombs[i].gone) continue;
      if (held && held.bomb === bombs[i]) held = null;
      bombs.splice(i, 1);
    }
    for (i = booms.length - 1; i >= 0; i--) {
      booms[i].age += STEP;
      if (booms[i].age >= booms[i].life) booms.splice(i, 1);
    }
    flash -= STEP;
  }

  function drawBomb(m) {
    var r = m.r;
    ctx.fillStyle = m.k.color;
    ctx.beginPath();
    if (m.kind === 'tnt') {
      ctx.fillRect(m.x - r, m.y - r * 0.75, r * 2, r * 1.75);
      ctx.fillStyle = '#22262e';
      ctx.fillRect(m.x - r, m.y - r * 0.35, r * 2, 2);
      ctx.fillRect(m.x - r, m.y + r * 0.45, r * 2, 2);
    } else if (m.kind === 'nuke') {
      ctx.moveTo(m.x - r * 1.9, m.y - r * 0.8);
      ctx.lineTo(m.x - r, m.y);
      ctx.lineTo(m.x - r * 1.9, m.y + r * 0.8);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(m.x, m.y, r * 1.5, r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath();
      ctx.arc(m.x + r * 0.3, m.y, r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.arc(m.x, m.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a404c';
      ctx.fillRect(m.x - 3, m.y - r - 4, 6, 5);
    }
    // a lit fuse blinks red
    if (m.fuse !== null && Math.floor(m.fuse * 8) % 2 === 0) {
      ctx.strokeStyle = '#ff3b30';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(m.x, m.y, r * 1.6 + 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  function drawBooms() {
    for (var i = 0; i < booms.length; i++) {

            if (dy > 0 && (m === FL || m === FR)) a.ground = 0.15;
            if (dy < 0 && (n === FL || n === FR)) b.ground = 0.15;

        }
      }
    }
  }

  // Keeps every joint inside the box. No bounce: the joint just stops on the wall.
  // The whole body's speed into the wall decides whether the hit injures.
  function walls(b) {
    var pts = b.pts;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], r = p.r;
      var live = !b.off[i];   // a severed part hitting a wall doesn't hurt anyone
      if (p.y > H - r) {
        if (live) { hurt(b, b.cvy); b.ground = 0.15; }
        p.y = H - r; p.py = p.y;
        p.px = p.x - (p.x - p.px) * 0.7;
      } else if (p.y < r) {
        if (live) hurt(b, -b.cvy);
        p.y = r; p.py = p.y;
      }
      if (p.x > W - r) {
        if (live) hurt(b, b.cvx);
        p.x = W - r; p.px = p.x;
      } else if (p.x < r) {
        if (live) hurt(b, -b.cvx);
        p.x = r; p.px = p.x;
      }
    }
  }

  function step() {
    var i, n;
    clock += STEP;
    for (i = 0; i < bodies.length; i++) { integrate(bodies[i]); stand(bodies[i]); }
    for (n = 0; n < STIFFNESS; n++) {
      for (i = 0; i < bodies.length; i++) bones(bodies[i]);
    }
    collide();
    for (i = 0; i < bodies.length; i++) walls(bodies[i]);
    for (i = 0; i < vehicles.length; i++) stepVehicle(vehicles[i]);
    collideVehicles();
    stepBombs();
    for (i = 0; i < swords.length; i++) stepSword(swords[i]);
    stepBlood();
    for (i = shots.length - 1; i >= 0; i--) {
      shots[i].age += STEP;

  // Axe, bat and gun, drawn along the x axis from the handle end
  function drawOther(s) {
    var len = s.len;
    if (s.type === 'axe') {
      ctx.fillStyle = '#7a4a22';
      ctx.fillRect(0, -3, len, 6);
      ctx.fillStyle = '#b9c1cd';
      ctx.strokeStyle = '#6f7885';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(len - 26, -3);
      ctx.lineTo(len - 24, -22);
      ctx.lineTo(len - 2, -24);
      ctx.lineTo(len - 4, -3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (s.type === 'bat') {
      ctx.fillStyle = '#c79a5b';
      ctx.strokeStyle = '#8a6532';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -2.5);
      ctx.lineTo(len - 24, -6.5);
      ctx.lineTo(len - 4, -6.5);
      ctx.lineTo(len, 0);
      ctx.lineTo(len - 4, 6.5);
      ctx.lineTo(len - 24, 6.5);
      ctx.lineTo(0, 2.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (s.type === 'spear') {
      ctx.fillStyle = '#7a4a22';
      ctx.fillRect(0, -2, len - 18, 4);
      ctx.fillStyle = '#b9c1cd';
      ctx.strokeStyle = '#6f7885';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(len - 22, 0);
      ctx.lineTo(len - 15, -5);
      ctx.lineTo(len, 0);
      ctx.lineTo(len - 15, 5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      var long = len > 40;   // shotgun and rifle get a wooden stock
      if (Math.cos(s.ang) < 0) ctx.scale(1, -1);   // keep the grip underneath
      ctx.fillStyle = '#3a404c';
      ctx.fillRect(long ? 15 : 0, 0, 8, long ? 12 : 17);
      ctx.fillStyle = '#7b8496';
      ctx.fillRect(0, -4, len, s.type === 'shotgun' ? 9 : 7);
      if (long) {
        ctx.fillStyle = '#7a4a22';
        ctx.fillRect(0, -4, 15, 11);
      }

        ctx.beginPath();
        ctx.arc(len + 6, 0, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // One shot along the barrel. It stops at the first joint it meets, or the wall.
  // Head and chest are fatal, like every other weapon; anywhere else is a wound.
  // A rifle round keeps going and hits every joint on its line.
  function shot(s, ang) {
    var dx = Math.cos(ang), dy = Math.sin(ang), ox = s.b.x, oy = s.b.y;
    function damage(b, j) {
      wound(b, j, 14);
      b.pts[j].x += dx * 8;
      b.pts[j].y += dy * 8;
      if (j === HEAD || j === CH) kill(b);
    }
    var best = Infinity, hitB = null, hitJ = -1;
    if (dx > 0) best = Math.min(best, (W - ox) / dx); else if (dx < 0) best = Math.min(best, -ox / dx);
    if (dy > 0) best = Math.min(best, (H - oy) / dy); else if (dy < 0) best = Math.min(best, -oy / dy);
    for (var i = 0; i < bodies.length; i++) {
      var pts = bodies[i].pts;
      for (var j = 0; j < pts.length; j++) {
        var fx = pts[j].x - ox, fy = pts[j].y - oy;
        var t = fx * dx + fy * dy;
        if (t <= 0 || t >= best) continue;
        if (fx * fx + fy * fy - t * t >= pts[j].r * pts[j].r) continue;
        if (s.kind.pierce) damage(bodies[i], j);
        else { best = t; hitB = bodies[i]; hitJ = j; }
      }

  }
  function fire(s) {

    s.b.px += dx; s.b.py += dy;
  }

  function drawSword(s) {
    ctx.save();
    ctx.translate(s.a.x, s.a.y);
    ctx.rotate(s.ang);
    // sword, dagger and katana share this drawing at their own lengths
    if (!s.kind.cut || !s.kind.stab) { drawOther(s); ctx.restore(); return; }
    ctx.fillStyle = '#7a4a22';
    ctx.fillRect(0, -3, 14, 6);
    ctx.fillStyle = '#e3a02f';
    ctx.fillRect(13, -9, 5, 18);
    ctx.fillStyle = '#b9c1cd';
    ctx.strokeStyle = '#6f7885';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(18, -3.5);
    ctx.lineTo(s.len - 11, -3.5);
    ctx.lineTo(s.len, 0);
    ctx.lineTo(s.len - 11, 3.5);
    ctx.lineTo(18, 3.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Draws the two bones of an arm or leg, starting at BONES index k. A cut bone is left out,

  function limb(b, k, width, color) {

      else { ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); }
      ctx.stroke();
    }
  }
  function drawAnimal(b) {
    var p = b.pts, sp = b.sp, k = sp.scale, head = p[HEAD];
    var body = b.skin, far = b.state === 'dead' ? '#8f908a' : sp.far;
    limb(b, 15, 6 * k, far);
    limb(b, 19, 6 * k, far);

    ctx.moveTo(p[SL].x, p[SL].y);
    ctx.lineTo(p[SR].x, p[SR].y);
    ctx.lineTo(p[HR].x, p[HR].y);
    ctx.lineTo(p[HL].x, p[HL].y);

    ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(p[SR].x, p[SR].y);
      ctx.lineTo(head.x, head.y);
      ctx.stroke();
    }

    limb(b, 17, 6 * k, body);

    dx /= dl; dy /= dl;

    ctx.beginPath();

    ctx.fill();
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 8 * k, 0, Math.PI * 2);

    ctx.fill();

    ctx.fillStyle = ctx.strokeStyle = '#1d1a19';

    ctx.beginPath();

      ctx.moveTo(ex - 2, ey + 2); ctx.lineTo(ex + 2, ey - 2);
      ctx.stroke();

      ctx.arc(ex, ey, 1.5 * k, 0, Math.PI * 2);
      ctx.fill();
    }

    for (var w = 0; w < b.wounds.length; w++) {
      ctx.beginPath();
      ctx.arc(p[b.wounds[w]].x, p[b.wounds[w]].y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPerson(b) {
    if (b.sp.animal) { drawAnimal(b); return; }
    var p = b.pts, head = p[HEAD];
    limb(b, 17, 9, PANTS);
    limb(b, 19, 9, PANTS);
    if (b.state !== 'ok') {

      ctx.beginPath();
      ctx.arc(p[KL].x, p[KL].y, 3.5, 0, Math.PI * 2);
      ctx.arc(p[KR].x, p[KR].y, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.strokeStyle = b.skin;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo((p[SL].x + p[SR].x) / 2, (p[SL].y + p[SR].y) / 2);
    if (!b.off[HEAD]) ctx.lineTo(head.x, head.y);
    ctx.stroke();
    // torso
    ctx.fillStyle = ctx.strokeStyle = b.shirt;
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(p[SL].x, p[SL].y);
    ctx.lineTo(p[SR].x, p[SR].y);
    ctx.lineTo(p[HR].x, p[HR].y);
    ctx.lineTo(p[HL].x, p[HL].y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    limb(b, 13, 7, b.skin);
    limb(b, 15, 7, b.skin);
    // head, with hair on the side facing away from the chest
    ctx.fillStyle = b.skin;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 10, 0, Math.PI * 2);
    ctx.fill();
    var up = Math.atan2(head.y - p[CH].y, head.x - p[CH].x);
    ctx.fillStyle = b.hair;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 10, up - Math.PI / 2, up + Math.PI / 2);
    ctx.closePath();
    ctx.fill();

    var ux = Math.cos(up), uy = Math.sin(up);
    ctx.fillStyle = ctx.strokeStyle = '#1d1a19';
    ctx.lineWidth = 1.5;
    for (var s = -1; s <= 1; s += 2) {
      var ex = head.x - ux * 3.5 - uy * 3.5 * s, ey = head.y - uy * 3.5 + ux * 3.5 * s;
      ctx.beginPath();

        ctx.arc(ex, ey, 1.6, 0, Math.PI * 2);
        ctx.fill();
      } else if (b.state === 'broken') {
        ctx.moveTo(ex + uy * 2, ey - ux * 2);
        ctx.lineTo(ex - uy * 2, ey + ux * 2);
        ctx.stroke();
      } else {
        ctx.moveTo(ex - 2, ey - 2); ctx.lineTo(ex + 2, ey + 2);
        ctx.moveTo(ex - 2, ey + 2); ctx.lineTo(ex + 2, ey - 2);
        ctx.stroke();
      }
    }
    // stab wounds
    ctx.fillStyle = '#b3243a';
    for (var w = 0; w < b.wounds.length; w++) {
      var wp = p[b.wounds[w]];
      ctx.beginPath();
      ctx.arc(wp.x, wp.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = ctx.lineJoin = 'round';
    for (var i = 0; i < vehicles.length; i++) drawVehicle(vehicles[i]);
    ctx.lineCap = ctx.lineJoin = 'round';
    for (i = 0; i < bodies.length; i++) drawPerson(bodies[i]);
    drawBlood();
    ctx.lineCap = ctx.lineJoin = 'round';
    for (i = 0; i < swords.length; i++) drawSword(swords[i]);
    for (i = 0; i < bombs.length; i++) drawBomb(bombs[i]);
    drawBooms();

    ctx.strokeStyle = '#e3a02f';
    ctx.lineWidth = 2;
    for (i = 0; i < shots.length; i++) {
      ctx.globalAlpha = 1 - shots[i].age / 0.1;
      ctx.beginPath();
      ctx.moveTo(shots[i].x0, shots[i].y0);
      ctx.lineTo(shots[i].x1, shots[i].y1);
      ctx.stroke();
    }

  }

  function tick(t) {
    acc += Math.min(0.05, (t - last) / 1000);
    last = t;
    var n = 0;
    while (acc >= STEP && n < 6) { step(); acc -= STEP; n++; }
    if (acc >= STEP) acc = 0;
    draw();
    requestAnimationFrame(tick);
  }

  function local(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  // The joint nearest the pointer, if any is within reach
  function jointAt(pos) {
    var best = null, bestD = GRAB * GRAB;
    for (var i = bodies.length - 1; i >= 0; i--) {
      var pts = bodies[i].pts;
      for (var j = 0; j < pts.length; j++) {
        var dx = pts[j].x - pos.x, dy = pts[j].y - pos.y;
        var d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = { body: bodies[i], pt: pts[j] }; }
      }
    }
    return best;
  }
  // A sword whose blade or hilt is under the pointer; it is always held by the hilt
  function swordAt(pos) {
    for (var i = swords.length - 1; i >= 0; i--) {
      var a = swords[i].a, b = swords[i].b;
      var dx = b.x - a.x, dy = b.y - a.y;
      var t = ((pos.x - a.x) * dx + (pos.y - a.y) * dy) / (dx * dx + dy * dy || 1);
      t = Math.min(Math.max(t, 0), 1);
      if (Math.hypot(pos.x - a.x - dx * t, pos.y - a.y - dy * t) < 12) return { sword: swords[i], pt: a };
    }
    return null;
  }
  function bombAt(pos) {
    for (var i = bombs.length - 1; i >= 0; i--) {
      if (Math.hypot(pos.x - bombs[i].x, pos.y - bombs[i].y) <= bombs[i].r * 1.5 + 6) return { bomb: bombs[i] };
    }
    return null;
  }
  function vehicleAt(pos) {
    for (var i = vehicles.length - 1; i >= 0; i--) {
      var v = vehicles[i];
      if (Math.abs(pos.x - v.x) <= v.w / 2 && Math.abs(pos.y - v.y) <= v.h / 2) return { vehicle: v };
    }
    return null;
  }
  function aim(pos) {
    held.tx = Math.min(Math.max(pos.x + (held.ox || 0), 12), W - 12);
    held.ty = Math.min(Math.max(pos.y + (held.oy || 0), 12), H - 12);
  }

  // Dragging people that are already in the box, by whichever body part was grabbed
  canvas.addEventListener('pointerdown', function (e) {
    var pos = local(e);
    var hit = bombAt(pos) || swordAt(pos) || jointAt(pos) || vehicleAt(pos);
    if (!hit) return;
    var thing = hit.vehicle || hit.bomb;
    if (thing) {
      // hold it where it was grabbed, and remember the press so a tap can work the engine or fuse
      hit.ox = thing.x - pos.x;
      hit.oy = thing.y - pos.y;
      hit.sx = pos.x;
      hit.sy = pos.y;
      hit.t0 = performance.now();
    }
    if (hit.sword) {
      // picking a sword up pulls it out of whoever it was in
      hit.sword.stuck = null;
      hit.sword.cool = 0.25;
      // keep the handle where it is under the pointer, and remember the press so a tap can fire a gun
      hit.ox = hit.sword.a.x - pos.x;
      hit.oy = hit.sword.a.y - pos.y;
      hit.sx = pos.x;
      hit.sy = pos.y;
      hit.t0 = performance.now();
    }
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    held = hit;
    aim(pos);

  canvas.addEventListener('pointermove', function (e) {

    }
    else canvas.style.cursor = bombAt(pos) || swordAt(pos) || jointAt(pos) || vehicleAt(pos) ? 'grab' : '';
  });
  function release() {

    // the same quick tap on a vehicle starts or stops its engine
    if (held && held.vehicle && !held.moved && performance.now() - held.t0 < 350) {
      held.vehicle.on = !held.vehicle.on;
    }

    if (held && held.bomb && !held.moved && performance.now() - held.t0 < 350 && held.bomb.fuse === null) {

    canvas.style.cursor = '';

  canvas.addEventListener('pointercancel', release);

  // Dragging a new person out of the sidebar
  function moveGhost(e) {
    ghost.el.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    ghost.samples.push({ x: e.clientX, y: e.clientY, t: performance.now() });

  // Release velocity from the last few pointer positions; a pause before letting go means a plain drop
  function throwSpeed(list) {

    if (span < 0.005 || performance.now() - b.t > 80) return { x: 0, y: 0 };
    var vx = (b.x - a.x) / span, vy = (b.y - a.y) / span;
    var sp = Math.hypot(vx, vy);
    if (sp > MAX_THROW) { vx *= MAX_THROW / sp; vy *= MAX_THROW / sp; }
    return { x: vx, y: vy };
  }
  function source(btn, spawn) {
    btn.addEventListener('pointerdown', function (e) {
      if (ghost) return;
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      var el = document.createElement('div');
      el.className = 'ghost';
      el.innerHTML = btn.innerHTML;
      el.style.width = btn.offsetWidth + 'px';
      el.style.margin = -btn.offsetHeight / 2 + 'px 0 0 ' + -btn.offsetWidth / 2 + 'px';
      document.body.appendChild(el);
      ghost = { el: el, samples: [] };
      moveGhost(e);
    });
    btn.addEventListener('pointermove', function (e) { if (ghost) moveGhost(e); });

      if (!ghost) return;
      var v = throwSpeed(ghost.samples);
      ghost.el.remove();
      ghost = null;
      var pos = local(e);

    });

      if (ghost) { ghost.el.remove(); ghost = null; }
    });

    source(document.getElementById(kind), function (x, y, vx, vy) { addBody(kind, x, y, vx, vy); });
  });
  Object.keys(VEHICLES).forEach(function (kind) {
    source(document.getElementById(kind), function (x, y, vx, vy) { addVehicle(kind, x, y, vx, vy); });
  });
  Object.keys(POTIONS).forEach(function (kind) {
    source(document.getElementById(kind), function (x, y) { applyPotion(kind, x, y); });
  });
  Object.keys(BOMBS).forEach(function (kind) {
    source(document.getElementById(kind), function (x, y, vx, vy) { addBomb(kind, x, y, vx, vy); });
  });
  Object.keys(KINDS).forEach(function (type) {

  new ResizeObserver(resize).observe(box);
  resize();
  requestAnimationFrame(function (t) { last = t; tick(t); });
})();
